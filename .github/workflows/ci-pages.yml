name: Validate and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Smoke test API distributions
        run: |
          test -s api/v1/manifest.json
          test -s api/v1/catalog.json
          test -s api/v1/collections.json
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('api/v1/manifest.json', 'utf8'));
          const index = JSON.parse(fs.readFileSync('api/v1/collections.json', 'utf8'));
          if (!index.collections.length) process.exit(1);
          for (const collection of index.collections) {
            const jsonPath = `api/v1/${collection.json}`;
            const csvPath = `api/v1/${collection.csv}`;
            if (!fs.existsSync(jsonPath) || !fs.existsSync(csvPath)) process.exit(1);
            const rows = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
            if (!Array.isArray(rows) || rows.length !== manifest.record_counts[collection.name]) process.exit(1);
          }
          NODE
      - name: Upload API audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: books-api-v1
          path: api/v1/
          retention-days: 30
      - name: Reject raw source data and generated debug files
        run: |
          test ! -e data/catalog.debug.json
          test ! -e data/raw.json
          test ! -e data/source_records.json
          test -z "$(find . -name 'KindleSyncMetadataCache.xml' -print -quit)"

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run api:build
      - name: Check whether Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --output /tmp/pages.json --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled. Set Settings > Pages > Source to GitHub Actions, then rerun this workflow."
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - if: steps.pages.outputs.enabled == 'true'
        name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
