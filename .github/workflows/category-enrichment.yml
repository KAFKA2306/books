name: Enrich book categories

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/category-enrichment.yml'
      - 'scripts/enrich-categories.mjs'
      - 'src/category-enrichment.mjs'
      - 'data/catalog.json'
      - 'data/issue-1-books.json'
      - 'data/isbn-enrichments.json'
      - 'data/kindle/**'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Number of due uncategorized works to inspect
        required: false
        default: '100'

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: category-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect due uncategorized works
        env:
          LIMIT: ${{ github.event.inputs.limit || '100' }}
        run: npm run category:enrich -- --limit "$LIMIT"

      - name: Validate catalog and generated API
        run: npm run check

      - name: Detect audited changes
        id: changes
        run: |
          if git diff --quiet -- \
            data/category-enrichments.json \
            data/category-enrichment-state.json \
            data/category-enrichment-report.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit verified category state
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/category-enrichments.json \
            data/category-enrichment-state.json \
            data/category-enrichment-report.json
          git commit -m "chore(data): enrich deterministic book categories"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Rebuild and deploy Pages
        if: steps.changes.outputs.changed == 'true'
        run: gh workflow run ci-pages.yml --ref main

      - name: Record automation failure
        if: failure()
        continue-on-error: true
        run: |
          title="Category enrichment automation failed"
          body=$(cat <<EOF
          The deterministic NDC category enrichment workflow failed.

          - Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Commit: ${GITHUB_SHA}
          - Trigger: ${GITHUB_EVENT_NAME}

          The catalog was not updated unless classification, validation, and push all completed successfully.
          EOF
          )
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
