name: Enrich ISBN metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/isbn-enrichment.yml'
      - 'scripts/enrich-isbn.mjs'
      - 'src/isbn-enrichment.mjs'
      - 'tests/catalog.test.mjs'
  schedule:
    - cron: '17 2 * * *'
    - cron: '47 14 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Number of due works to inspect
        required: false
        default: '25'
      concurrency:
        description: Number of works to inspect in parallel
        required: false
        default: '4'

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: isbn-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect due works
        env:
          LIMIT: ${{ github.event.inputs.limit || '25' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '4' }}
        run: npm run isbn:enrich -- --limit "$LIMIT" --concurrency "$CONCURRENCY"

      - name: Validate catalog and generated API
        run: npm run check

      - name: Detect audited changes
        id: changes
        run: |
          if git diff --quiet -- \
            data/isbn-enrichments.json \
            data/isbn-enrichment-state.json \
            data/isbn-enrichment-report.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet -- data/isbn-enrichments.json; then
            echo "catalog_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "catalog_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit verified enrichment state
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/isbn-enrichments.json \
            data/isbn-enrichment-state.json \
            data/isbn-enrichment-report.json
          git commit -m "chore(data): enrich verified ISBN metadata"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Rebuild and deploy Pages
        if: steps.changes.outputs.catalog_changed == 'true'
        run: gh workflow run ci-pages.yml --ref main

      - name: Record automation failure
        if: failure()
        continue-on-error: true
        run: |
          title="ISBN enrichment automation failed"
          body=$(cat <<EOF
          The scheduled ISBN enrichment workflow failed.

          - Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Commit: ${GITHUB_SHA}
          - Trigger: ${GITHUB_EVENT_NAME}

          The catalog was not updated unless the validation and push steps completed successfully.
          EOF
          )
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
