name: Enrich library classifications

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/classification-enrichment.yml'
      - 'scripts/enrich-classifications.mjs'
      - 'src/classification.mjs'
      - 'data/isbn-enrichments.json'
      - 'data/classifications.json'
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Number of ISBN editions to inspect
        required: false
        default: '25'
      concurrency:
        description: Number of ISBN lookups in parallel
        required: false
        default: '4'

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: classification-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch NDL classifications by verified ISBN
        env:
          LIMIT: ${{ github.event.inputs.limit || '25' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '4' }}
        run: npm run classification:enrich -- --limit "$LIMIT" --concurrency "$CONCURRENCY"

      - name: Validate catalog and generated API
        run: npm run check

      - name: Detect audited classification changes
        id: changes
        run: |
          if git diff --quiet -- \
            data/classifications.json \
            data/classification-state.json \
            data/classification-report.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit source-reported classifications
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/classifications.json \
            data/classification-state.json \
            data/classification-report.json
          git commit -m "chore(data): enrich NDL classification metadata"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Rebuild and deploy Pages
        if: steps.changes.outputs.changed == 'true'
        run: gh workflow run ci-pages.yml --ref main

      - name: Record automation failure
        if: failure()
        continue-on-error: true
        run: |
          title="Classification enrichment automation failed"
          body=$(cat <<EOF
          The scheduled library classification enrichment workflow failed.

          - Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Commit: ${GITHUB_SHA}
          - Trigger: ${GITHUB_EVENT_NAME}

          No NDC9-to-NDC10 conversion is performed. The catalog is updated only after validation succeeds.
          EOF
          )
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
