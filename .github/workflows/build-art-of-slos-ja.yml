name: Build The Art of SLOs Japanese EPUB

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_art_of_slos_epub.py"
      - "ebooks/the-art-of-slos-ja/**"
      - ".github/workflows/build-art-of-slos-ja.yml"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check builder syntax
        run: python -m py_compile scripts/build_art_of_slos_epub.py

      - name: Build EPUB
        run: python scripts/build_art_of_slos_epub.py

      - name: Validate Kindle EPUB
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET

          path = Path("dist/the-art-of-slos-ja.epub")
          assert path.exists() and path.stat().st_size > 20_000

          with zipfile.ZipFile(path) as z:
              assert z.namelist()[0] == "mimetype"
              assert z.read("mimetype") == b"application/epub+zip"

              required = (
                  "META-INF/container.xml",
                  "EPUB/content.opf",
                  "EPUB/nav.xhtml",
                  "EPUB/content.xhtml",
                  "EPUB/license.xhtml",
                  "EPUB/cover.xhtml",
                  "EPUB/cover.jpg",
              )
              for name in required:
                  assert name in z.namelist(), name

              opf = z.read("EPUB/content.opf").decode("utf-8")
              content = z.read("EPUB/content.xhtml").decode("utf-8")
              css = z.read("EPUB/styles.css").decode("utf-8")

              ET.fromstring(z.read("META-INF/container.xml"))
              ET.fromstring(z.read("EPUB/content.opf"))
              ET.fromstring(z.read("EPUB/nav.xhtml"))
              ET.fromstring(z.read("EPUB/content.xhtml"))

              assert '<meta property="rendition:layout">reflowable</meta>' in opf
              assert '<meta property="rendition:flow">scrolled-continuous</meta>' in opf
              assert 'properties="cover-image"' in opf
              assert len(z.read("EPUB/cover.jpg")) > 10_000
              assert content.count("<table>") >= 2
              assert "SLO を利用して" in content
              assert "writing-mode:horizontal-tb" in css

              for garbage in (
                  "________________",
                  "原文:",
                  "ダウンタイム早見表 3",
                  "<p></p>",
              ):
                  assert garbage not in content, garbage

          print(path, path.stat().st_size)
          PY

      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: the-art-of-slos-ja
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/the-art-of-slos-ja.epub --clobber
          else
            gh release create "$TAG" dist/the-art-of-slos-ja.epub \
              --target "$GITHUB_SHA" \
              --title "The Art of SLOs 日本語版 EPUB" \
              --notes "Google公開の日本語版 The Art of SLOs をKindle向けリフロー型EPUBへ再構成した非公式版。原資料は CC BY 4.0。"
          fi
